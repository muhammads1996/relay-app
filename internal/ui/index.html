}

function responseBodyIncomplete(r) {
  if (!r) return false;
  const buffered = Number(r.bufferedBytes), received = Number(r.actualBytes), expected = Number(r.contentLength);
  return !!r.truncated || r.bodyComplete === false ||
    (Number.isFinite(buffered) && Number.isFinite(received) && received > buffered) ||
    (Number.isFinite(expected) && expected >= 0 && Number.isFinite(received) && received < expected);
}

function renderResponse(card) {
  card = card || $('respCard'); if (!card) return;
  card.innerHTML = '';
  const r = S.last;
  card.classList.toggle('hasResp', !!r);
  const metaBar = h('div', { id: 'respMeta' }, h('span', { class: 'lbl' }, 'Response'));
  const key = S.req ? responseKey(S.req.id, S.envName) : '';
  const failure = key ? S.sendFailures.get(key) : null;
  if (S.sending && S.sendingKey === key) metaBar.append(h('span', { class: 'pill', role: 'status' }, r ? 'New request in progress · previous response below' : 'Request in progress'));
  if (!r) {
    metaBar.append(h('span', { style: 'color:var(--faint)' }, '—'));
    card.append(metaBar);
    if (failure) card.append(renderSendFailure(failure));
    return;
  }
  const ok = r.status >= 200 && r.status < 400;
  const bodyFormat = detectBodyFormat(r.headers, r.body);
  const availableFormats = getAvailableFormats(bodyFormat);
  const transfer = [];
  if (Number.isFinite(Number(r.bufferedBytes))) transfer.push(`Preview: ${fmtSize(Number(r.bufferedBytes))}`);
  if (Number.isFinite(Number(r.actualBytes))) transfer.push(`Received total: ${fmtSize(Number(r.actualBytes))}`);
  if (Number.isFinite(Number(r.contentLength)) && Number(r.contentLength) >= 0) transfer.push(`Content-Length: ${fmtSize(Number(r.contentLength))}`);
  if (responseBodyIncomplete(r)) transfer.push('Body incomplete' + (r.truncated || (Number.isFinite(Number(r.bufferedBytes)) && Number.isFinite(Number(r.actualBytes)) && Number(r.actualBytes) > Number(r.bufferedBytes)) ? ' · preview truncated' : ''));
  metaBar.append(
    h('span', { class: 'pill ' + (ok ? 'ok' : 'bad') }, h('span', { class: 'dot' }), `${r.status} ${esc(r.statusText).replace(/^\d+ /, '')}`),
    h('span', {}, `Time: ${r.timing.total.toFixed(0)}ms`),
    h('span', {}, `Preview body: ${fmtSize(r.size)}${responseBodyIncomplete(r) ? ' (incomplete)' : ''}`),
    transfer.length ? h('span', { class: 'transferInfo', role: 'status', 'aria-live': 'polite' }, transfer.join(' · ')) : '',
    h('span', { class:'note', title:'Display and copy controls use only the received response preview; full download is unavailable.' }, 'Received preview · full download unavailable'),
    h('span', { style: 'color:var(--dim)' }, `Sent: ${S.lastSuccessAt.get(key) || 'time unavailable'}`),
    h('span', { class: 'formatBadge', title: headerValue(r.headers, 'content-type') || 'Detected from body' }, (S.respFormat || bodyFormat).toUpperCase()),
    h('span', { class: 'actions' },
      h('button', { class: 'iconBtn', 'aria-label':S.respPretty?'Show raw response preview':'Pretty-print response preview', title: 'Toggle formatted/raw response', onclick: () => { S.respPretty = !S.respPretty; renderResponse(); } }, S.respPretty ? 'Raw' : 'Pretty'),
      h('button', { class: 'iconBtn', 'aria-label':S.respWrap?'Turn response wrapping off':'Turn response wrapping on', title: 'Toggle line wrapping', onclick: () => { S.respWrap = !S.respWrap; renderResponse(); } }, S.respWrap ? 'No wrap' : 'Wrap'),
      h('input', { id:'responseSearch', type:'search', class:'responseSearch', value:S.respSearch, placeholder:'Find in preview', 'aria-label':'Search response preview', oninput:e=>{
        S.respSearch=e.target.value; S.respMatchIndex=0;
        const start=e.target.selectionStart, end=e.target.selectionEnd;
        clearTimeout(responseSearchTimer);
        responseSearchTimer=setTimeout(()=>{renderResponse(); const input=$('responseSearch'); if(input){input.focus();input.setSelectionRange(start,end);}},120);
      } }),
      h('button', { class:'iconBtn', 'aria-label':'Next response search result', title:'Next response search result', onclick:()=>{S.respMatchIndex++;focusResponseSearchMatch();} }, 'Next'),
      availableFormats.length > 0 ? h('div', { class: 'formatDropdown' },
        h('button', { class: 'iconBtn', title: 'Convert format', onclick: function(e) { 
          this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'block' ? 'none' : 'block';
        }}, '⚙ Format'),
        h('div', { class: 'formatMenu', style: 'display:none' },
          availableFormats.map(fmt => h('button', { 
            onclick: () => { 
              S.respFormat = fmt; 
              document.querySelector('.formatDropdown .formatMenu').style.display = 'none';
              renderResponse();
            } }, fmt.toUpperCase())))) : '',
      h('button', { class: 'iconBtn', title: 'Reset request/response split', onclick: resetResponsePaneSize }, '↕ Reset'),
      h('button', { class: 'iconBtn', 'aria-label':'Clear displayed response preview', title: 'Clear displayed response preview; history remains available', onclick: clearResponsePreview }, 'Clear'),
      h('button', { class: 'iconBtn', title: S.responseMaximized ? 'Restore request and response panes' : 'Maximize response pane', onclick: toggleResponseMaximized }, S.responseMaximized ? 'Restore' : 'Maximize'),
      h('button', { class: 'iconBtn', 'aria-label':'Copy response preview body', title: 'Copy response preview body', onclick: () => copyText(r.body, 'Response preview') }, '⧉ Body'),
      h('button', { class: 'iconBtn', title: 'Copy as curl (secrets become $RELAY_SECRET_* references)', onclick: copyCurl }, '⧉ curl')));
  const nHdr = Object.keys(r.headers).length;
  const activeRespTab = S.respTab || 'body';
  const responseTabs = ['body', 'headers', 'timing'];

    h('button', { id: `response-tab-${t}`, role: 'tab', 'aria-controls': 'responsePanel', 'data-tab-group': 'response', 'data-tab': t, 'aria-selected': String(activeRespTab === t), tabindex: activeRespTab === t ? '0' : '-1', class: activeRespTab === t ? 'on' : '',
      onkeydown: e => arrowTabKey(e, activeRespTab, responseTabs, next => { S.respTab = next; renderResponse(); }, 'response'),
      onclick: () => { S.respTab = t; renderResponse(); } },
      t[0].toUpperCase() + t.slice(1),
      t === 'headers' && nHdr ? h('span', { class: 'n' }, nHdr) : '')));
  const panel = h('div', { id: 'responsePanel', role: 'tabpanel', 'aria-labelledby': `response-tab-${activeRespTab}` });

  const t = S.respTab || 'body';
  if (t === 'body') {
    const shown = getResponseDisplay(r);

    const searchInput = metaBar.querySelector('.responseSearch');
    if (searchInput) searchInput.setAttribute('aria-describedby','responseSearchCount');
    const nextSearch = [...metaBar.querySelectorAll('button')].find(b => b.getAttribute('aria-label') === 'Next response search result');
    if (nextSearch) nextSearch.disabled = found.count === 0;

  } else if (t === 'headers') {

    const tm = r.timing, total = Math.max(tm.total, 0.001);

      ['dns', 'connect', 'tls', 'ttfb', 'download'].map(k =>

          h('span', { class: 'bar', style: `width:${Math.max(2, 220 * tm[k] / total)}px` })))));
  }
  if (Array.isArray(r.console) && r.console.length) {
    const consolePanel = h('details', { class: 'metaCard', style: 'margin:10px 14px;padding:10px' },
      h('summary', { style: 'cursor:pointer;font-weight:700' }, `Script console · ${r.console.length} message${r.console.length === 1 ? '' : 's'}`));
    for (const item of r.console) {
      const level = String(item.level || 'log').toLowerCase();
      consolePanel.append(h('div', { style: `font:12px var(--mono);white-space:pre-wrap;margin-top:5px;color:${level === 'error' ? 'var(--red)' : level === 'warn' ? 'var(--amber)' : 'var(--dim)'}` },
        `${level}: ${String(item.message ?? '')}`));

  if (!ok) {

    if (upstream) card.append(upstream);
  }
  const allTests = [
    ...(r.assertions || []).map(a => ({ label: a.type + ': ' + a.message, passed: a.passed, src: 'assert', assertion: a })),
    ...(r.scriptTests || []).map(t => ({ label: t.name + (t.error ? ': ' + t.error : ''), passed: t.passed, src: 'pm.test' })),
  ];
  if (allTests.length) {
    card.append(h('div', { id: 'assertChips' }, allTests.map(a =>
      h('span', {
        class: 'chip ' + (a.passed ? 'ok' : 'bad') + (a.src === 'assert' ? ' clickable' : ''),
        title: a.src === 'assert' ? 'Click to add to request' : a.label,
        style: a.src === 'assert' ? 'cursor:pointer' : '',
        onclick: a.src === 'assert' ? () => addAssertionFromHistory(a.assertion) : undefined
      },
        (a.passed ? '✓ ' : '✕ ') + (a.src === 'pm.test' ? '●' : '') + ' ' + a.label))));
  }
}

// headerSection renders one titled header table. origins (when given) adds

function headerSection(title, headers, origins, count) {

      onclick: () => copyText(k + ': ' + headers[k], k) },

async function copyCurl() {
  if (!S.req) return;
  try {
    const out = await api(`/api/requests/${S.req.id}/curl?env=${encodeURIComponent(S.envName)}`);
    await copyText(out.curl, 'curl command');
  } catch (e) { toast(e.message, true); }
}

function formatBodyForDisplay(headers, text, pretty = true) {
  const detectedFormat = detectBodyFormat(headers, text);
  const displayFormat = S.respFormat || detectedFormat;
  let converted = text;
  
  // Convert if requested format differs from detected
  if (displayFormat !== detectedFormat && S.respFormat) {
    try {
      converted = convertFormat(detectedFormat, displayFormat, text);
    } catch (e) {
      return { format: detectedFormat, text: String(text || ''), error: e.message };
    }
  }
  
  if (!pretty) return { format: displayFormat, text: String(converted || '') };
  try {
    if (displayFormat === 'html') return { format: displayFormat, text: indentMarkup(String(converted || '').trim()) };
    return { format: displayFormat, text: formatBodyText(displayFormat, converted, false) };
  } catch {
    return { format: displayFormat, text: String(converted || '') };
  }
}

// upstreamErrorDetails pulls the useful, support-facing fields out of common
// gateway responses where a provider nests a JSON error document in message.
// It never changes the raw response body or status assertion outcome.
function upstreamErrorDetails(text) {
  let outer;
  try { outer = JSON.parse(text); } catch { return null; }
  if (!outer || typeof outer !== 'object') return null;
  const outerMessage = typeof outer.message === 'string' ? outer.message : '';
  let detail = outer;
  const nested = outerMessage.match(/Response:\s*(\{[\s\S]*\})\s*\)?\s*$/i);
  if (nested) {
    try { detail = JSON.parse(nested[1]); } catch { /* retain outer document */ }
  }
  const message = String(detail.status_message || detail.message || outerMessage || '').trim();
  const status = String(detail.http_code || detail.status || '').trim();
  const code = String(detail.bh_response_code || detail.code || '').trim();
  const reference = String(detail.request_reference || detail.requestReference || '').trim();
  if (!message && !status && !code && !reference) return null;
  return {
    message: message.replace(/\s*\(\s*$/g, ''),
    status,
    code,
    reference,
  };
}

async function saveRequest(showToast = false) {
  if (!S.req) return true;
  const requestId = S.req.id;
  if (S.saving) {
    while (S.saving) await new Promise(resolve => setTimeout(resolve, 10));
    if (S.req?.id !== requestId) return false;
    if (!S.reqDirty) return true;
  }
  if (!S.reqDirty && !showToast) return true;
  S.saving = true;
  const setStatus = (message, failed = false) => {
    S.saveFailed = failed;
    const status = $('draftStatus'), retry = $('retrySaveBtn');
    if (status) status.textContent = S.saveConflict ? 'Save conflict · your draft is retained' : message;
    if (retry) { retry.hidden = !failed; retry.textContent = S.saveConflict ? 'Review overwrite…' : 'Retry save'; }
    $('reloadConflictBtn').hidden = !S.saveConflict;
  };
  try {
    while (S.req?.id === requestId && S.reqDirty) {
      const revision = S.reqRevision;
      const snapshot = structuredClone(S.req);
      setStatus('Saving…');
      const saved = await api('/api/requests/' + requestId, { method: 'PUT', body: snapshot });
      if (saved && saved.contentHash && S.req?.id === requestId) S.req.contentHash = saved.contentHash;
      S.saveConflict = false;
      const meta = findReqMeta(requestId);
      if (meta) { meta.meta.name = snapshot.spec.name; meta.meta.method = snapshot.spec.method; meta.meta.url = snapshot.spec.url; }
      if (S.req?.id !== requestId) break;
      if (S.reqRevision === revision) {
        S.reqDirty = false;
        S.saveFailed = false;
        setReqDirty(false);
      }
    }
    renderSide();
    let cleared=true;
    if(S.req?.id===requestId&&!S.reqDirty)cleared=await clearRequestDraft(requestId);
    if (showToast) toast(cleared?'Request saved':'Request saved; a newer recovery copy was retained',!cleared);
    return S.req?.id === requestId && !S.reqDirty;
  } catch (e) { S.saveConflict = e.status === 409; toast(e.message, true); }
  finally { S.saving = false; }
  S.saveFailed = true;
  setStatus('Unsaved changes · save failed', true);
  return false;
}

async function deleteRequest() {
  if (!S.req) return;
  if (!await modal.confirm(`Delete "${S.req.spec.name}"?`, { danger: true, ok: 'Delete' })) return;
  try {
    await api('/api/requests/' + S.req.id, { method: 'DELETE' });
    S.reqId = null; S.req = null; S.last = null;
    await refresh();
    $('work').innerHTML = '<div class="empty">Select a request, or create one.</div>';
    $('meta').hidden = true;
    $('crumb').textContent = 'Workspace';
  } catch (e) { toast(e.message, true); }
}

let sendController = null;
let sendStartedAt = 0;

function cancelSend() {
  sendController?.abort();
}

function setSendPhase(phase) {
  S.sendPhase = phase;
  const button = $('sendBtn');
  if (button) button.textContent = phase || 'Send';
  const cancel = $('cancelSendBtn');
  if (cancel) cancel.hidden = !S.sending;
  const progress = $('sendProgress');
  if (progress) progress.textContent = phase ? `${phase} request` : '';
}

async function send() {
  if (!S.req || S.sending) return;
  const requestId = S.req.id, env = S.envName;
  const tabKey = requestTabKey(requestId, env);
  S.sending = true;
  S.sendingKey = responseKey(requestId, env);
  const controller = new AbortController();
  sendController = controller;
  sendStartedAt = performance.now();
  const progressTimer = setInterval(() => {
    const cancel = $('cancelSendBtn');
    if (cancel) cancel.textContent = `Cancel (${((performance.now() - sendStartedAt) / 1000).toFixed(1)}s)`;
  }, 100);
  const button = $('sendBtn');
  if (button) button.disabled = true;
  setSendPhase('Saving…');
  renderResponse();
  try {
    if (!(await saveRequest())) return;
    controller.signal.throwIfAborted();
    setSendPhase('Sending…');
    const result = await api('/api/send', { method: 'POST', body: { requestId, env }, signal: controller.signal });
    const key = responseKey(requestId, env);
    S.lastByRequest.set(key, result);
    S.lastSuccessAt.set(key, new Date().toLocaleString());
    const tab = S.requestTabCache.get(tabKey); if (tab) tab.last = result;
    S.sendFailures.delete(key);
    if (S.req?.id === requestId && S.envName === env) {
      S.last = result;
      S.respFormat = null;
      renderResponse(); loadStats(requestId); loadHistory();
    }
  } catch (e) {
    const key = responseKey(requestId, env);
    const cancelled = controller.signal.aborted;
    const stage = cancelled ? 'Cancelled' : e.status === 422 ? 'Request resolution / validation' : e.status === 502 ? 'Network / DNS / TLS / transport' : e.status === 504 ? 'Timeout' : e.status ? `Send (HTTP ${e.status})` : 'Network / transport';
    const message = cancelled ? 'Stopped waiting for this request. The server may already have processed it.' : e.message || 'Send failed';
    S.sendFailures.set(key, { message, stage, at:new Date().toISOString() });
    if (S.req?.id === requestId && S.envName === env) renderResponse();
    toast(cancelled ? 'Request cancelled' : message, !cancelled);
  }
  finally { clearInterval(progressTimer); sendController = null; S.sending = false; S.sendingKey = ''; setSendPhase(''); if (button?.isConnected) button.disabled = false; const activeSend = $('sendBtn'); if (activeSend) activeSend.disabled = false; if (S.req?.id === requestId && S.envName === env) renderResponse(); }
}

    }
  }
  card.append(chips);
  card.append(h('div', { class: 'note', style: 'margin-top:14px' },
    'Presets applied at the folder level are inherited by all requests within that folder unless overridden. Secret values are stored locally and never shown or exported.'));

// sampleResponseFor returns a parsed JSON sample of the last real response
// for `full` ({id, spec, ...}), used by the clickable response-tree
// assertion authoring. Returns null when no JSON sample is available yet.
function sampleResponseFor(full) {
  let body = null;
  if (S.req && S.req.id === full.id && S.last) body = S.last.body;
  else if (S.lastTestRun && S.lastTestRun.id === full.id) body = S.lastTestRun.result.body;
  if (body == null) return null;
  try { return JSON.parse(body); } catch { return null; }
}

// traceCardSection renders the Traceability card wired to the real Xray /
// Jira endpoints: link an existing test, create a new Xray test issue, and

function traceCardSection(full, spec, save) {
  const card = h('div', { class: 'card', style: 'padding:14px' },

    statusLine.innerHTML = '';
    statusLine.append(spec.xrayKey
      ? h('span', { class: 'valMsg ok' }, '✓ Linked to ' + spec.xrayKey)
      : h('span', { class: 'valMsg bad' }, '✕ Not linked to Xray'));
  };
  renderStatus();
  card.append(statusLine);

  const reqChips = h('div', { class: 'chips', style: 'margin-top:10px' });
  const renderReqs = () => {
    reqChips.innerHTML = '';
    for (const rq of spec.requirements || []) {
      reqChips.append(h('span', { class: 'att on' }, rq + ' ',
        h('button', { class: 'delRow', title: 'Remove from this list (does not unlink in Jira)',
          onclick: () => { spec.requirements = spec.requirements.filter(x => x !== rq); save(); renderReqs(); } }, ' ✕')));
    }
    if (!(spec.requirements || []).length) reqChips.append(h('span', { style: 'color:var(--faint);font-size:12px' }, 'No linked requirements yet.'));
  };
  renderReqs();

  card.append(h('div', { class: 'traceActions' },
    h('button', { class: 'btn sm', onclick: async () => {
      const key = await modal.prompt('Link existing Xray test', { placeholder: 'AML-T142', value: spec.xrayKey || '' });
      if (!key) return;
      try {
        const ref = await api('/api/xray/test?key=' + encodeURIComponent(key));
        if (!ref) { toast('No Xray test found for ' + key, true); return; }
        spec.xrayKey = key; save(); renderStatus();
        toast('Linked to ' + key + (ref.summary ? ' — ' + ref.summary : ''));
      } catch (e) { toast(e.message, true); }
    } }, 'Link existing test'),
    h('button', { class: 'btn sm', onclick: async () => {
      try {
        const r = await api('/api/xray/test', { method: 'POST', body: { requestId: full.id, summary: spec.name } });
        spec.xrayKey = r.xrayKey; renderStatus();
        toast('Created Xray test ' + r.xrayKey);
      } catch (e) { toast(e.message, true); }
    } }, 'Create Xray issue'),
    h('button', { class: 'btn sm', onclick: async () => {
      if (!spec.xrayKey) { toast('Link or create an Xray test first', true); return; }
      const raw = await modal.prompt('Requirement keys (comma separated)', { placeholder: 'AML-1, AML-2' });
      if (!raw) return;
      const keys = raw.split(',').map(s => s.trim()).filter(Boolean);
      if (!keys.length) return;
      try {
        const r = await api('/api/xray/requirements/link', { method: 'POST', body: { requestId: full.id, requirementKeys: keys } });
        spec.requirements = r.requirements; renderReqs();
        toast('Linked ' + keys.length + ' requirement' + (keys.length === 1 ? '' : 's'));
      } catch (e) { toast(e.message, true); }
    } }, 'Link requirements')));

  card.append(reqChips);
  card.append(h('div', { class: 'note', style: 'margin-top:10px' },
    'Linking/creating calls Xray and Jira directly. Configure project key and credentials in Settings → Xray Cloud.'));
  return card;
}

/* ---------- helpers ---------- */
function debounce(fn, ms) {
  let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}
async function copyText(text, label) {
  // Show copy preview by selecting text in response body if visible
  const respBody = $('respBody');
  if (respBody && respBody.textContent.includes(text)) {
    const range = document.createRange();
    const sel = window.getSelection();
    range.selectNodeContents(respBody);
    sel.removeAllRanges();
    sel.addRange(range);
    setTimeout(() => sel.removeAllRanges(), 100);
  }
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = h('textarea', { style: 'position:fixed;opacity:0' }, text);
    document.body.append(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  toast(label + ' copied to clipboard');
}
function slugify(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'collection'; }
function fmtSize(n) { return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; }

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'f' && S.view === 'collections') { e.preventDefault(); $('collectionSearch').focus(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Tab' && S.view === 'collections' && S.requestTabOrder.length > 1) {
    e.preventDefault(); const i = S.requestTabOrder.indexOf(S.activeRequestTabKey); const n = (i + (e.shiftKey ? -1 : 1) + S.requestTabOrder.length) % S.requestTabOrder.length; switchRequestTab(S.requestTabOrder[n]);
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'w' && S.view === 'collections' && S.activeRequestTabKey) { e.preventDefault(); closeRequestTab(S.activeRequestTabKey); }
});
const treeResize = $('treeResize');
const setTreeWidth = width => {
  S.treeWidth = Math.min(360, Math.max(160, Math.round(width)));
  document.documentElement.style.setProperty('--side-width', `${S.treeWidth}px`);
  treeResize.setAttribute('aria-valuenow', String(S.treeWidth));
};
treeResize.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault(); setTreeWidth(S.treeWidth + (e.key === 'ArrowRight' ? 16 : -16));
    localStorage.treeWidth = String(S.treeWidth);
  } else if (e.key === 'Home') { e.preventDefault(); setTreeWidth(160); localStorage.treeWidth = '160'; }
  else if (e.key === 'End') { e.preventDefault(); setTreeWidth(360); localStorage.treeWidth = '360'; }
});
treeResize.addEventListener('pointerdown', e => {
  e.preventDefault(); treeResize.setPointerCapture(e.pointerId); document.body.classList.add('resizingTree');
  const move = ev => setTreeWidth(ev.clientX - $('rail').getBoundingClientRect().width);
  const end = () => {
    localStorage.treeWidth = String(S.treeWidth); document.body.classList.remove('resizingTree');
    treeResize.removeEventListener('pointermove', move); treeResize.removeEventListener('pointerup', end); treeResize.removeEventListener('pointercancel', end);
  };
  treeResize.addEventListener('pointermove', move); treeResize.addEventListener('pointerup', end); treeResize.addEventListener('pointercancel', end);
});
refresh().then(() => {
  if (usesWorkspaceFiles()) workspaceRefreshTimer = setTimeout(pollWorkspaceRefreshStatus, 100);
  if (S.state.collections[0]) {
    S.openCols.add(S.state.collections[0].id);
    renderSide();
  }
  return restoreRequestTabs();
}).then(restored => {
  if (!restored && S.state.collections[0]) {
    const first = S.state.collections[0].requests[0];
    if (first) openRequest(first.id);
  }
  loadHistory();
}).catch(e => toast(e.message, true));
</script>
